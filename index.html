<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSN Astronomi 2025 – Kumpulan Soal Interaktif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#060B1A;--bg2:#0D1630;--bg3:#0F1E3D;
    --card:#111C3A;--card2:#162246;
    --accent:#4F8EFF;--accent2:#7B5CFA;--gold:#F5C842;--green:#3DDC84;--red:#FF5B5B;
    --text:#E8EEFF;--text2:#9AAED4;--text3:#5A73A8;
    --border:#1E2E5A;--border2:#243566;
    --r:12px;--r2:8px;
    font-size:16px;
  }
  body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:hidden}

  /* STARS BACKGROUND */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:var(--o1,.2)}50%{opacity:var(--o2,.8)}}

  /* LAYOUT */
  .app{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:1.5rem 1rem 4rem}

  /* HEADER */
  header{text-align:center;padding:2.5rem 0 2rem}
  .logo-orbit{display:inline-flex;align-items:center;gap:.6rem;margin-bottom:1.2rem}
  .orbit-icon{width:48px;height:48px;border:2px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;animation:spin 20s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .orbit-dot{width:10px;height:10px;background:var(--gold);border-radius:50%;position:absolute;top:-5px;left:50%;transform:translateX(-50%)}
  .orbit-planet{font-size:26px}
  .title-main{font-size:clamp(1.5rem,5vw,2.4rem);font-weight:700;letter-spacing:-.5px;line-height:1.15}
  .title-sub{font-size:.9rem;color:var(--text2);margin-top:.5rem;letter-spacing:.5px}
  .badge-row{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
  .badge{background:var(--card2);border:1px solid var(--border2);border-radius:20px;padding:.25rem .75rem;font-size:.75rem;color:var(--text2);font-family:'Space Mono',monospace}
  .badge.accent{background:rgba(79,142,255,.15);border-color:var(--accent);color:var(--accent)}

  /* PROGRESS */
  .progress-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem 1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  .prog-stats{display:flex;gap:1.5rem;flex:1}
  .prog-stat{display:flex;flex-direction:column;gap:.2rem}
  .prog-label{font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-family:'Space Mono',monospace}
  .prog-val{font-size:1.25rem;font-weight:700}
  .prog-val.correct{color:var(--green)}
  .prog-val.wrong{color:var(--red)}
  .progress-bar-wrap{flex:2;min-width:140px}
  .progress-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .4s ease;width:0%}
  .prog-pct{font-size:.75rem;color:var(--text2);margin-top:.3rem;font-family:'Space Mono',monospace}

  /* NAV GRID */
  .nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:.4rem;margin-bottom:1.5rem}
  .nav-btn{height:44px;border-radius:var(--r2);border:1px solid var(--border);background:var(--card);color:var(--text2);font-family:'Space Mono',monospace;font-size:.8rem;cursor:pointer;transition:all .15s;position:relative}
  .nav-btn:hover{border-color:var(--accent);color:var(--accent)}
  .nav-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .nav-btn.answered-correct{background:rgba(61,220,132,.15);border-color:var(--green);color:var(--green)}
  .nav-btn.answered-wrong{background:rgba(255,91,91,.15);border-color:var(--red);color:var(--red)}
  .nav-btn.answered-shown{background:rgba(79,142,255,.1);border-color:var(--accent);color:var(--accent)}

  /* QUESTION CARD */
  .q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;animation:fadeIn .25s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .q-header{background:var(--card2);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem}
  .q-num{font-family:'Space Mono',monospace;font-size:.75rem;color:var(--accent);background:rgba(79,142,255,.15);border:1px solid rgba(79,142,255,.3);border-radius:20px;padding:.2rem .7rem;white-space:nowrap}
  .q-type{font-size:.7rem;color:var(--text3);margin-left:auto;text-transform:uppercase;letter-spacing:.5px}
  .q-body{padding:1.5rem}
  .q-text{font-size:1rem;line-height:1.7;color:var(--text);margin-bottom:1.25rem}
  .q-text strong{color:var(--gold)}

  /* TABLE */
  .data-table{width:100%;border-collapse:collapse;font-size:.85rem;font-family:'Space Mono',monospace;margin:1rem 0;background:var(--bg2);border-radius:var(--r2);overflow:hidden;border:1px solid var(--border)}
  .data-table th{background:var(--bg3);color:var(--accent);padding:.5rem .8rem;text-align:left;font-size:.75rem;letter-spacing:.5px}
  .data-table td{padding:.4rem .8rem;border-top:1px solid var(--border);color:var(--text2)}
  .data-table tr:hover td{background:rgba(79,142,255,.05)}

  /* OPTIONS */
  .options{display:flex;flex-direction:column;gap:.6rem}
  .option{display:flex;align-items:flex-start;gap:.75rem;padding:.85rem 1rem;border:1px solid var(--border);border-radius:var(--r2);cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
  .option:hover{border-color:var(--accent);background:rgba(79,142,255,.06)}
  .option.selected{border-color:var(--accent2);background:rgba(123,92,250,.1)}
  .option.correct{border-color:var(--green);background:rgba(61,220,132,.12)}
  .option.wrong{border-color:var(--red);background:rgba(255,91,91,.1)}
  .option.reveal-correct{border-color:var(--green);background:rgba(61,220,132,.08)}
  .option-key{font-family:'Space Mono',monospace;font-size:.8rem;min-width:26px;height:26px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;margin-top:.05rem;transition:all .15s}
  .option.correct .option-key{background:var(--green);border-color:var(--green);color:#000}
  .option.wrong .option-key{background:var(--red);border-color:var(--red);color:#fff}
  .option.reveal-correct .option-key{background:rgba(61,220,132,.3);border-color:var(--green);color:var(--green)}
  .option-text{font-size:.92rem;line-height:1.55;color:var(--text)}
  .option-check{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);font-size:1.1rem}

  /* MULTI-SELECT HINT */
  .multi-hint{font-size:.75rem;color:var(--text3);margin-bottom:.6rem;font-style:italic}

  /* FORMULA */
  .formula-box{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent2);border-radius:var(--r2);padding:.75rem 1rem;margin:.75rem 0;font-family:'Space Mono',monospace;font-size:.85rem;color:var(--text2);line-height:1.6}
  .formula-box .var{color:var(--gold)}
  .formula-box .eq{color:var(--accent)}

  /* SUBMIT */
  .action-row{display:flex;gap:.75rem;margin-top:1.25rem;align-items:center;flex-wrap:wrap}
  .btn-submit{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--r2);padding:.7rem 1.5rem;font-size:.9rem;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:opacity .15s}
  .btn-submit:hover{opacity:.85}
  .btn-submit:disabled{opacity:.4;cursor:not-allowed}
  .btn-show{background:transparent;color:var(--text2);border:1px solid var(--border);border-radius:var(--r2);padding:.7rem 1.25rem;font-size:.88rem;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .15s}
  .btn-show:hover{border-color:var(--text2);color:var(--text)}
  .result-badge{font-size:.85rem;padding:.4rem .9rem;border-radius:20px;font-weight:600}
  .result-badge.correct{background:rgba(61,220,132,.2);color:var(--green);border:1px solid rgba(61,220,132,.4)}
  .result-badge.wrong{background:rgba(255,91,91,.15);color:var(--red);border:1px solid rgba(255,91,91,.3)}

  /* EXPLANATION */
  .explanation{margin-top:1.25rem;border-top:1px solid var(--border);padding-top:1.25rem;animation:fadeIn .3s ease}
  .expl-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.85rem}
  .expl-icon{width:28px;height:28px;background:rgba(245,200,66,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem}
  .expl-title{font-size:.8rem;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);font-weight:600}
  .expl-body{font-size:.92rem;line-height:1.75;color:var(--text2)}
  .expl-body p{margin-bottom:.65rem}
  .expl-body strong{color:var(--text)}
  .expl-body .highlight{background:rgba(79,142,255,.1);border:1px solid rgba(79,142,255,.2);border-radius:6px;padding:.5rem .85rem;margin:.5rem 0;font-family:'Space Mono',monospace;font-size:.82rem;color:var(--accent);display:block}
  .expl-body .answer-line{background:rgba(61,220,132,.08);border:1px solid rgba(61,220,132,.25);border-radius:6px;padding:.5rem .85rem;margin:.5rem 0;font-size:.88rem;color:var(--green);display:block}
  .expl-body .key-concept{background:rgba(123,92,250,.1);border-left:3px solid var(--accent2);border-radius:0 6px 6px 0;padding:.5rem .85rem;margin:.6rem 0;font-size:.88rem}

  /* NAV BUTTONS */
  .nav-row{display:flex;gap:.75rem;margin-top:1rem;justify-content:space-between;align-items:center}
  .btn-nav{background:var(--card2);color:var(--text2);border:1px solid var(--border2);border-radius:var(--r2);padding:.6rem 1.2rem;font-size:.88rem;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .15s;display:flex;align-items:center;gap:.4rem}
  .btn-nav:hover{border-color:var(--accent);color:var(--text)}
  .btn-nav:disabled{opacity:.35;cursor:not-allowed}

  /* SCORE MODAL */
  .score-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(6,11,26,.92);align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .score-overlay.show{display:flex}
  .score-card{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:2.5rem 2rem;max-width:420px;width:90%;text-align:center;animation:fadeIn .3s ease}
  .score-ring{width:110px;height:110px;margin:0 auto 1.5rem;position:relative}
  .score-ring svg{transform:rotate(-90deg)}
  .score-ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .score-ring-num .big{font-size:2rem;font-weight:700;line-height:1}
  .score-ring-num .small{font-size:.75rem;color:var(--text2)}
  .score-title{font-size:1.4rem;font-weight:700;margin-bottom:.5rem}
  .score-msg{color:var(--text2);font-size:.9rem;margin-bottom:1.5rem;line-height:1.6}
  .score-stats{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.5rem}
  .score-stat-box{background:var(--bg3);border-radius:var(--r2);padding:.85rem;border:1px solid var(--border)}
  .score-stat-box .lbl{font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:.3rem}
  .score-stat-box .val{font-size:1.5rem;font-weight:700}
  .btn-restart{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--r2);padding:.8rem 2rem;font-size:.95rem;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;width:100%}

  .q-image-note{background:rgba(79,142,255,.07);border:1px solid rgba(79,142,255,.2);border-radius:var(--r2);padding:.6rem 1rem;font-size:.82rem;color:var(--text3);margin:.75rem 0;font-style:italic}

  @media(max-width:600px){
    .prog-stats{gap:.75rem}
    .q-body{padding:1rem}
    .action-row{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="app">

<header>
  <div class="logo-orbit">
    <div class="orbit-icon">
      <div class="orbit-dot"></div>
      <span class="orbit-planet">🪐</span>
    </div>
  </div>
  <div class="title-main">OSN Astronomi 2025</div>
  <div class="title-sub">Soal Seleksi Calon Peserta Olimpiade Sains Nasional · Tingkat Kabupaten/Kota</div>
  <div class="badge-row">
    <span class="badge accent">30 Soal</span>
    <span class="badge">Pilihan Ganda + Kompleks</span>
    <span class="badge">Pembahasan Lengkap</span>
    <span class="badge">Kemendikdasmen 2025</span>
  </div>
</header>

<div class="progress-wrap">
  <div class="prog-stats">
    <div class="prog-stat">
      <span class="prog-label">Dijawab</span>
      <span class="prog-val" id="stat-answered">0/30</span>
    </div>
    <div class="prog-stat">
      <span class="prog-label">Benar</span>
      <span class="prog-val correct" id="stat-correct">0</span>
    </div>
    <div class="prog-stat">
      <span class="prog-label">Salah</span>
      <span class="prog-val wrong" id="stat-wrong">0</span>
    </div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    <div class="prog-pct" id="prog-pct">0% selesai</div>
    <button class="btn-show" onclick="showScore()" style="margin-top:.5rem;font-size:.78rem;padding:.35rem .8rem">Lihat Nilai</button>
  </div>
</div>

<div class="nav-grid" id="nav-grid"></div>

<div id="question-container"></div>

<div class="nav-row">
  <button class="btn-nav" id="btn-prev" onclick="goQ(currentQ-1)">← Sebelumnya</button>
  <span id="q-counter" style="font-family:'Space Mono',monospace;font-size:.82rem;color:var(--text3)"></span>
  <button class="btn-nav" id="btn-next" onclick="goQ(currentQ+1)">Berikutnya →</button>
</div>

</div>

<!-- SCORE MODAL -->
<div class="score-overlay" id="score-overlay" onclick="closeScore(event)">
  <div class="score-card">
    <div class="score-ring">
      <svg width="110" height="110" viewBox="0 0 110 110">
        <circle cx="55" cy="55" r="46" fill="none" stroke="#1E2E5A" stroke-width="10"/>
        <circle cx="55" cy="55" r="46" fill="none" stroke="url(#gr)" stroke-width="10" stroke-dasharray="289" stroke-dashoffset="289" stroke-linecap="round" id="ring-circle"/>
        <defs><linearGradient id="gr" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4F8EFF"/><stop offset="100%" stop-color="#7B5CFA"/></linearGradient></defs>
      </svg>
      <div class="score-ring-num">
        <span class="big" id="score-pct">0%</span>
        <span class="small">skor</span>
      </div>
    </div>
    <div class="score-title" id="score-title">Hasil Kuis</div>
    <div class="score-msg" id="score-msg"></div>
    <div class="score-stats">
      <div class="score-stat-box"><div class="lbl">Benar</div><div class="val" style="color:var(--green)" id="sc-correct">0</div></div>
      <div class="score-stat-box"><div class="lbl">Salah</div><div class="val" style="color:var(--red)" id="sc-wrong">0</div></div>
      <div class="score-stat-box"><div class="lbl">Dijawab</div><div class="val" id="sc-answered">0</div></div>
      <div class="score-stat-box"><div class="lbl">Total Soal</div><div class="val">30</div></div>
    </div>
    <button class="btn-restart" onclick="restartQuiz()">🔄 Mulai Ulang</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    id:1, type:"multiple",
    text:"Persamaan garis yang sesuai untuk data panjang gelombang (nm) dan temperatur (K) dalam tabel adalah",
    table:{headers:["Panjang gelombang (nm)","Temperatur (K)"],rows:[["2897,77","1000"],["1931,85","1500"],["1448,89","2000"],["965,924","3000"],["579,554","5000"],["289,777","10000"]]},
    options:["x = (3 × 10⁶)y⁻¹","x = (3 × 10⁻⁶)x⁻¹","y = (3 × 10⁶)x⁻¹","y = (3 × 10⁻⁶)x⁻¹","y = (3 × 10⁶)x⁻²"],
    answer:[0,2],
    explanation:`<p>Data ini merepresentasikan <strong>Hukum Perpindahan Wien</strong>: λ<sub>max</sub> · T = b, dimana b ≈ 2,897 × 10⁶ nm·K.</p>
    <span class="highlight">λ·T = 2,897 × 10⁶ nm·K ≈ 3 × 10⁶ nm·K</span>
    <p>Misalkan <strong>x = λ (panjang gelombang, nm)</strong> dan <strong>y = T (temperatur, K)</strong>:</p>
    <p>Dari x·y = 3 × 10⁶, maka:</p>
    <span class="highlight">x = (3 × 10⁶) · y⁻¹  →  pernyataan 1 ✓</span>
    <span class="highlight">y = (3 × 10⁶) · x⁻¹  →  pernyataan 3 ✓</span>
    <p>Kedua persamaan secara matematis ekuivalen. Pernyataan 2 salah karena menggunakan 10⁻⁶ (satuan tidak cocok), pernyataan 4 salah karena koefisiennya 10⁻⁶, dan pernyataan 5 salah karena eksponen x adalah −2.</p>
    <span class="answer-line">Jawaban: 1 dan 3</span>`
  },
  {
    id:2, type:"multiple",
    text:"Jika suatu hari seorang pengamat melihat Matahari terbit tepat dari arah timur, maka pernyataan yang benar adalah",
    options:["Pengamatan kemungkinan dilakukan sekitar tanggal 21 Maret","Posisi pengamat berada di selatan ekuator","Pengamatan kemungkinan dilakukan sekitar tanggal 22 Juni","Posisi pengamat berada di utara ekuator","Pengamatan kemungkinan dilakukan sekitar tanggal 23 September"],
    answer:[0,4],
    explanation:`<p>Matahari terbit tepat dari arah timur (azimut = 90°) hanya terjadi ketika <strong>deklinasi Matahari = 0°</strong>, yaitu saat equinox.</p>
    <div class="key-concept">Equinox: Matahari berada tepat di ekuator langit (deklinasi = 0°), terbit dari timur dan terbenam dari barat persis — terjadi ~21 Maret (equinox musim semi) dan ~23 September (equinox musim gugur).</div>
    <p>Pada equinox, fenomena ini berlaku untuk <strong>semua lintang di Bumi</strong> (kecuali kutub), sehingga posisi pengamat tidak bisa ditentukan (bisa di utara maupun selatan ekuator).</p>
    <p>Pernyataan 2 (selatan ekuator) dan 4 (utara ekuator) tidak bisa disimpulkan karena Matahari terbit dari timur saat equinox di semua lintang.</p>
    <p>Pernyataan 3 (22 Juni) salah — pada 22 Juni deklinasi Matahari +23,44°, sehingga Matahari terbit dari timur laut.</p>
    <span class="answer-line">Jawaban: 1 dan 5</span>`
  },
  {
    id:3, type:"multiple",
    text:"Jika panjang siang lebih dari 12 jam dengan rumus cos H = −tan φ tan δ⊙, apa yang bisa disimpulkan?",
    formula:"cos H = − tan φ · tan δ⊙",
    formulaVars:"φ = lintang pengamat, δ⊙ = deklinasi Matahari, H = sudut jam Matahari saat di horizon, 2H = panjang siang",
    options:["Pengamat di belahan utara, pengamatan antara 21 Maret – 23 September","Pengamat di belahan utara, pengamatan antara 23 September – 21 Maret","Pengamat di belahan selatan, pengamatan antara 21 Maret – 23 September","Pengamat di belahan selatan, pengamatan antara 23 September – 21 Maret","Pengamat di ekuator, atau waktu 21 Maret atau 23 September"],
    answer:[0,3],
    explanation:`<p>Panjang siang = 2H > 12 jam → H > 90° → cos H < 0</p>
    <span class="highlight">cos H = −tan φ · tan δ⊙ < 0  ⟹  tan φ · tan δ⊙ > 0</span>
    <p>Ini berarti <strong>tan φ dan tan δ⊙ harus bertanda sama</strong>:</p>
    <p><strong>Kasus 1:</strong> φ > 0 (belahan utara) dan δ⊙ > 0 (21 Mar – 23 Sep) → keduanya positif ✓</p>
    <p><strong>Kasus 2:</strong> φ < 0 (belahan selatan) dan δ⊙ < 0 (23 Sep – 21 Mar) → keduanya negatif ✓</p>
    <div class="key-concept">Siang lebih dari 12 jam berarti Matahari berada di belahan langit yang sama dengan pengamat (keduanya di utara ATAU keduanya di selatan).</div>
    <span class="answer-line">Jawaban: 1 dan 4</span>`
  },
  {
    id:4, type:"multiple",
    text:"Jika kedua bintang mencapai meridian secara bersamaan, maka",
    options:["Kedua bintang memiliki deklinasi yang sama","Kedua bintang memiliki RA yang sama","Kedua bintang memiliki sudut jam (HA) yang sama","Kedua bintang memiliki azimuth yang sama","Kedua bintang memiliki tinggi (altitud) yang sama"],
    answer:[1,2],
    explanation:`<p>Sebuah bintang <strong>kulminasi (mencapai meridian)</strong> ketika sudut jamnya H = 0°. Artinya, saat kulminasi, Local Sidereal Time (LST) = RA bintang.</p>

let currentQ = 0;
let answers = {};
let shown = {};
let correct = 0, wrong = 0;

function initStars(){
  const c = document.getElementById('stars');
  for(let i=0;i<120;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2.5+.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--o1:${.1+Math.random()*.3};--o2:${.5+Math.random()*.5}`;
    c.appendChild(s);
  }
}

function buildNav(){
  const g=document.getElementById('nav-grid');g.innerHTML='';
  QUESTIONS.forEach((q,i)=>{
    const b=document.createElement('button');b.className='nav-btn';
    if(i===currentQ)b.classList.add('active');
    if(answers[i]!==undefined){
      if(shown[i]||answers[i]!==null){
        const isCorrect=checkAnswer(i,answers[i]);
        if(answers[i]===null||answers[i]===undefined)b.classList.add('answered-shown');
        else if(isCorrect)b.classList.add('answered-correct');
        else b.classList.add('answered-wrong');
      }
    } else if(shown[i]) b.classList.add('answered-shown');
    b.textContent=i+1;b.onclick=()=>goQ(i);
    g.appendChild(b);
  });
}

function checkAnswer(idx, sel){
  if(sel===null||sel===undefined)return false;
  const q=QUESTIONS[idx];
  if(q.type==='single') return sel.length===1&&sel[0]===q.answer[0];
  const a=[...q.answer].sort().join(',');
  const s=[...sel].sort().join(',');
  return a===s;
}

function goQ(n){
  if(n<0||n>=QUESTIONS.length)return;
  currentQ=n;
  buildNav();
  renderQ();
  document.getElementById('btn-prev').disabled=n===0;
  document.getElementById('btn-next').disabled=n===QUESTIONS.length-1;
  document.getElementById('q-counter').textContent=`Soal ${n+1} / ${QUESTIONS.length}`;
}

function renderQ(){
  const q=QUESTIONS[currentQ];
  const sel=answers[currentQ]||[];
  const isSubmitted=answers[currentQ]!==undefined;
  const isShown=shown[currentQ];
  const answered=isSubmitted||isShown;

  let html=`<div class="q-card">
  <div class="q-header">
    <span class="q-num">Soal ${q.id}</span>
    <span class="q-type">${q.type==='multiple'?'Pilihan Ganda Kompleks':'Pilihan Ganda'}</span>
  </div>
  <div class="q-body">
    <p class="q-text">${q.text}</p>`;

  if(q.formula) html+=`<div class="formula-box"><span class="eq">${q.formula}</span><br><span class="var" style="font-size:.78rem">${q.formulaVars}</span></div>`;
  if(q.imageNote) html+=`<div class="q-image-note">📌 Catatan gambar: ${q.imageNote}</div>`;

  if(q.table){
    html+=`<table class="data-table"><thead><tr>`;
    q.table.headers.forEach(h=>html+=`<th>${h}</th>`);
    html+=`</tr></thead><tbody>`;
    q.table.rows.forEach(r=>{html+=`<tr>`;r.forEach(c=>html+=`<td>${c}</td>`);html+=`</tr>`;});
    html+=`</tbody></table>`;
  }

  if(q.type==='multiple') html+=`<p class="multi-hint">💡 Pilih semua jawaban yang benar (bisa lebih dari satu)</p>`;

  html+=`<div class="options">`;
  const keys=['A','B','C','D','E','F'];
  q.options.forEach((opt,i)=>{
    let cls='option';
    if(answered){
      const isCorrectOpt=q.answer.includes(i);
      const isSelected=sel.includes(i);
      if(isSelected&&isCorrectOpt)cls+=' correct';
      else if(isSelected&&!isCorrectOpt)cls+=' wrong';
      else if(!isSelected&&isCorrectOpt)cls+=' reveal-correct';
    } else {
      if(sel.includes(i))cls+=' selected';
    }
    const check=answered?(q.answer.includes(i)&&sel.includes(i)?'✓':(sel.includes(i)&&!q.answer.includes(i)?'✗':(q.answer.includes(i)?'●':''))):'';
    html+=`<div class="${cls}" onclick="selectOpt(${i})" data-i="${i}">
      <div class="option-key">${keys[i]}</div>
      <div class="option-text">${opt}</div>
      ${check?`<span class="option-check">${check}</span>`:''}
    </div>`;
  });
  html+=`</div>`;

  let resultHtml='';
  if(answered){
    const isCorrect=checkAnswer(currentQ,sel);
    if(answers[currentQ]!==undefined&&answers[currentQ]!==null){
      resultHtml=`<span class="result-badge ${isCorrect?'correct':'wrong'}">${isCorrect?'✓ Benar!':'✗ Salah'}</span>`;
    } else {
      resultHtml=`<span class="result-badge" style="background:rgba(79,142,255,.15);color:var(--accent);border:1px solid rgba(79,142,255,.3)">Jawaban ditampilkan</span>`;
    }
  }

  html+=`<div class="action-row">
    ${!answered?`<button class="btn-submit" id="btn-submit-q" onclick="submitQ()">Periksa Jawaban</button>`:''}
    ${!answered?`<button class="btn-show" onclick="showAnswerOnly()">Lihat Jawaban</button>`:''}
    ${resultHtml}
  </div>`;

  if(answered){
    html+=`<div class="explanation">
      <div class="expl-header"><div class="expl-icon">💡</div><span class="expl-title">Pembahasan</span></div>
      <div class="expl-body">${q.explanation}</div>
    </div>`;
  }

  html+=`</div></div>`;
  document.getElementById('question-container').innerHTML=html;
  updateStats();
}

function selectOpt(i){
  if(answers[currentQ]!==undefined||shown[currentQ])return;
  const q=QUESTIONS[currentQ];
  if(!answers[currentQ])answers[currentQ]=undefined;
  let sel=answers[currentQ]||[];
  if(sel===undefined)sel=[];
  let tmp=[...sel];
  if(q.type==='single'){tmp=[i];}
  else{const idx=tmp.indexOf(i);if(idx>=0)tmp.splice(idx,1);else tmp.push(i);}
  answers[currentQ]=tmp;
  renderQ();
}

function submitQ(){
  const sel=answers[currentQ];
  if(!sel||sel.length===0){alert('Pilih jawaban terlebih dahulu!');return;}
  const isCorrect=checkAnswer(currentQ,sel);
  if(isCorrect)correct++;else wrong++;
  renderQ();buildNav();updateStats();
}

function showAnswerOnly(){
  shown[currentQ]=true;
  answers[currentQ]=null;
  renderQ();buildNav();updateStats();
}

function updateStats(){
  const total=Object.keys(answers).length+Object.keys(shown).filter(k=>answers[k]===undefined||shown[k]).length;
  const answeredCount=Object.values(answers).filter(v=>v!==null&&v!==undefined).length+Object.keys(shown).filter(k=>answers[k]===null).length;
  const allKeys=new Set([...Object.keys(answers),...Object.keys(shown)]);
  document.getElementById('stat-answered').textContent=`${allKeys.size}/30`;
  document.getElementById('stat-correct').textContent=correct;
  document.getElementById('stat-wrong').textContent=wrong;
  const pct=Math.round(allKeys.size/30*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=pct+'% selesai';
}

function showScore(){
  const answered=Object.keys(answers).filter(k=>answers[k]!==null&&answers[k]!==undefined).length;
  const pct=answered>0?Math.round(correct/answered*100):0;
  document.getElementById('score-pct').textContent=pct+'%';
  document.getElementById('sc-correct').textContent=correct;
  document.getElementById('sc-wrong').textContent=wrong;
  document.getElementById('sc-answered').textContent=answered;
  const circ=289;const offset=circ-(circ*pct/100);
  document.getElementById('ring-circle').style.strokeDashoffset=offset;
  let title,msg;
  if(pct>=90){title='Luar Biasa! 🌟';msg='Kemampuan astronomis kamu sangat tinggi. Siap berlomba di OSN!';}
  else if(pct>=70){title='Bagus Sekali! 🚀';msg='Pemahaman yang solid. Terus latihan untuk mencapai hasil sempurna!';}
  else if(pct>=50){title='Cukup Baik 🔭';msg='Fondasi sudah ada. Pelajari lagi konsep yang masih kurang.';}
  else{title='Terus Belajar 💪';msg='Jangan menyerah! Astronomi butuh latihan konsisten. Coba lagi!';}
  document.getElementById('score-title').textContent=title;
  document.getElementById('score-msg').textContent=msg;
  document.getElementById('score-overlay').classList.add('show');
}

function closeScore(e){if(e.target===document.getElementById('score-overlay'))document.getElementById('score-overlay').classList.remove('show');}

function restartQuiz(){
  answers={};shown={};correct=0;wrong=0;currentQ=0;
  document.getElementById('score-overlay').classList.remove('show');
  goQ(0);updateStats();
}

initStars();
goQ(0);
</script>
</body>
</html>
